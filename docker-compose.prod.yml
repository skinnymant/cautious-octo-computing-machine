# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: techmart

services:
  backend:
    build:
      target: production
    volumes: [] # no bind mounts in prod
    environment:
      NODE_ENV: production

  frontend:
    build:
      target: production
    volumes: []
    environment:
      NODE_ENV: production

  # Certbot for Let's Encrypt SSL issuance/renewal
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  adminer:
    profiles: ["debug"] # not exposed in prod by default

  mailhog:
    profiles: ["debug"]
